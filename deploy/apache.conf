<VirtualHost *:80>
    DocumentRoot /var/www/iha/public
    <Directory /var/www/iha/public>
        AllowOverride All
        Require all granted
    </Directory>
    # Nothing outside public/ is ever served.
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
